<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1020">
<title>Becze Manó-csapat: telefon</title>
<style>
  :root { --c: #475569; --d: #1e293b; --bg: #0b1020; --card: #1e293b; --txt: #f8fafc; --mut: #94a3b8; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt); overflow: hidden;
    font: 600 16px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  .emo { font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; }
  [hidden] { display: none !important; }

  #join, #pick { height: 100%; display: flex; flex-direction: column; gap: 12px; padding: 18px 16px; justify-content: center; max-width: 520px; margin: 0 auto; }
  h1 { margin: 0; text-align: center; color: #facc15; font-size: 32px; }
  .sub { margin: 0; text-align: center; color: var(--mut); }
  #code { font: 900 40px system-ui; text-align: center; letter-spacing: 8px; text-transform: uppercase; padding: 12px; border-radius: 18px; border: 3px solid #334155; background: var(--card); color: var(--txt); width: 100%; }
  .pickbtn { display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-radius: 20px; font-size: 24px; font-weight: 900; color: #0b1020; text-align: left; }
  .pickbtn .emo { font-size: 44px; }
  .pickbtn small { display: block; font-size: 14px; font-weight: 700; opacity: .8; }
  .pickbtn:disabled { opacity: .3; }
  .big { width: 100%; padding: 16px; border-radius: 20px; font-size: 22px; font-weight: 900; background: #facc15; color: #422006; }

  #game { height: 100%; display: flex; flex-direction: column; gap: 8px; padding: 10px 10px 12px; max-width: 900px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; background: var(--c); color: #0b1020; border-radius: 18px; padding: 6px 14px; }
  header .who { display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 900; }
  header .who .emo { font-size: 32px; }
  header .score { font-size: 16px; font-weight: 800; background: rgba(11,16,32,.25); padding: 4px 12px; border-radius: 14px; }
  #hint { text-align: center; color: #fef9c3; font-size: 15px; }
  #skill { text-align: center; color: var(--mut); font-size: 14px; }
  #pads { flex: 1; display: grid; grid-template-columns: 3fr 2fr; gap: 10px; min-height: 0; }
  #stick { position: relative; border-radius: 24px; background: radial-gradient(circle at 50% 50%, #1e293b, #0f172a); border: 3px solid #334155; overflow: hidden; touch-action: none; }
  #stick .lbl, #fire .lbl { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; color: var(--mut); font-size: 14px; pointer-events: none; }
  #base { position: absolute; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; border: 4px solid #475569; background: rgba(71,85,105,.25); left: 50%; top: 50%; pointer-events: none; }
  #knob { position: absolute; width: 74px; height: 74px; margin: -37px 0 0 -37px; border-radius: 50%; background: var(--c); border: 4px solid #fff; left: 50%; top: 50%; pointer-events: none; }
  #fire { position: relative; border-radius: 24px; background: var(--d); border: 6px solid var(--c); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 900; touch-action: none; text-align: center; }
  #fire.on { background: var(--c); color: #0b1020; transform: scale(.96); }
  #foot { display: flex; justify-content: space-between; align-items: center; color: var(--mut); font-size: 13px; gap: 8px; }
  #reset { padding: 8px 12px; border-radius: 14px; background: var(--card); font-size: 14px; position: relative; overflow: hidden; touch-action: none; }
  #reset i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(250,204,21,.35); }
  #warn, #offline { position: fixed; left: 10px; right: 10px; top: 10px; padding: 12px; border-radius: 16px; text-align: center; z-index: 5; }
  #warn { background: #fde047; color: #422006; }
  #warn button { margin-top: 6px; padding: 6px 16px; border-radius: 12px; background: #422006; color: #fde047; }
  #offline { background: #7f1d1d; color: #fee2e2; top: auto; bottom: 10px; }
</style>
</head>
<body>
<section id="join" hidden>
  <h1>🍄 Becze Manó-csapat</h1>
  <p class="sub">Írd be a kivetítőn látható négy betűt:</p>
  <input id="code" maxlength="4" autocomplete="off" autocapitalize="characters">
  <button class="big" id="go">Beszállok</button>
</section>

<section id="pick" hidden>
  <h1>🍄 Melyik manó vagy?</h1>
  <p class="sub" id="pickMsg">Mindenki egy másikat válasszon!</p>
  <div id="colors" style="display:flex;flex-direction:column;gap:8px"></div>
</section>

<section id="game" hidden>
  <header><span class="who"><span class="emo" id="meIcon"></span><span id="meName"></span></span><span class="score" id="score"></span></header>
  <div id="hint"></div>
  <div id="skill"></div>
  <div id="pads">
    <div id="stick"><div id="base"></div><div id="knob"></div><div class="lbl">futás · fel/le: mászás · le: kar</div></div>
    <button id="fire"><span id="fireTxt">UGRÁS</span></button>
  </div>
  <div id="foot"><button id="reset"><i></i>🔄 Pálya újra (tartsd nyomva)</button><span id="lag">késés: mérés…</span><span id="ver"></span></div>
</section>

<div id="warn" hidden></div>
<div id="offline" hidden>Nincs kapcsolat a kivetítővel…</div>
<script type="module" src="phone.js"></script>
</body>
</html>
